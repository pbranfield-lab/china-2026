  - main [ref=f10e27]:
    - generic [ref=f10e31]:
      - paragraph [ref=f10e32]:
        - text: Right, Shanghai, and this is the big one, properly the big one, about
        - strong [ref=f10e33]: 24 million
        - text: people, one of the biggest cities on the entire planet. The name literally means "on the sea", 上海, shàng is on and hǎi is sea, which is a very casual name for a place this enormous, but then it wasn't always this enormous, which is kind of the whole story.
      - paragraph [ref=f10e34]: Because it started as basically nothing, a fishing town on some muddy flats where the Yangtze river meets the sea. Then in the 1840s Britain won the First Opium War and made China open the port up to foreign trade, and everyone piled in, British, French, Americans, all setting up their own bits of the city with their own banks and their own rules. Not exactly a nice chapter of history, that one, but it is the reason the Bund looks the way it does, so you're sort of walking through it.
      - paragraph [ref=f10e35]:
        - text: The Bund is the strip along the river with
        - strong [ref=f10e36]: "52"
        - text: grand old stone buildings in a row, banks and hotels and trading houses from that era, and people call it a "museum of world architecture" because every single one's in a different style. And directly across the river there's Pudong, which was still basically farmland in the 1990s and is now the full sci-fi skyline you've seen in every film that wants to say "the future", including Shanghai Tower, the twisting one,
        - strong [ref=f10e37]: 632 metres
        - text: ", tallest building in China and second tallest on Earth."
      - paragraph [ref=f10e38]:
        - text: That's the actual thing about Shanghai, the old and new stuff isn't kept in separate zones, it's all stacked on top of itself. There's a proper Ming dynasty garden, Yu Garden, started in
        - strong [ref=f10e39]: "1559"
        - text: ", just sat there in the middle of the skyscrapers with a teahouse on stilts in a pond, completely unbothered by the four centuries that happened around it."
      - paragraph [ref=f10e40]:
        - text: Also this city does not do slow. The metro's the longest network in the world,
        - strong [ref=f10e41]: 831 kilometres
        - text: of it, there's a train to the airport that floats on magnets and does
        - strong [ref=f10e42]: 431 km/h
        - text: ", fastest commercial train anywhere, and even the lifts in Shanghai Tower do 74 km/h. Straight up. In a lift."
      - paragraph [ref=f10e43]: Dad's camera did not get one quiet minute in this entire city, and to be fair to him, for once I get it. Here's what we saw.
      - button "A small cat. Suspicious." [ref=f10e44] [cursor=pointer]
