  - main [ref=f3e27]:
    - generic [ref=f3e31]:
      - paragraph [ref=f3e32]: Right, before I get into what actually happened, I've got to explain what the Forbidden City even is, because apparently nobody will get the rest of it otherwise. Fine. It's basically the biggest, poshest house ever built, and it was built for one family only — the Emperor of China and everyone in his family.
      - paragraph [ref=f3e33]:
        - text: A guy called the Yongle Emperor started building it in
        - strong [ref=f3e34]: "1406"
        - text: . It took about
        - strong [ref=f3e35]: fourteen years
        - text: and reportedly over a million workers, and it was finished in
        - strong [ref=f3e36]: "1420"
        - text: ", which is when the Emperor actually moved in. Fourteen years to build one house. My Lego set takes me a whole weekend and I still moan about that."
      - paragraph [ref=f3e37]:
        - text: After that, emperors lived there for the next
        - strong [ref=f3e38]: 492 years
        - text: . That's
        - strong [ref=f3e39]: "24"
        - text: different emperors, from two different dynasties — first the Ming lot, then the Qing lot — all living in the same place, generation after generation, right up until
        - strong [ref=f3e40]: "1912"
        - text: ", when China stopped having emperors altogether."
      - paragraph [ref=f3e41]:
        - text: It's called "Forbidden" because ordinary people genuinely weren't allowed anywhere near it. The wall round the whole thing is over 10 metres high, and there's a moat outside that too, 52 metres wide, so nobody was wandering in by accident. Officially it's got
        - strong [ref=f3e42]: 8,707 rooms
        - text: ", though for ages people said it had 9,999.5, because a full 10,000 rooms was only allowed for Heaven and even the Emperor wasn't brave enough to build that many. Dam."
      - paragraph [ref=f3e43]: Mum was already arguing with a guide about something before we'd even got through the first gate, which, fair, that's basically her whole personality. Dad had his phone out taking photos of the wall and the moat before we'd even bought tickets, "for the archive." I already knew this was going to be a long day.
      - paragraph [ref=f3e44]: Anyway. That's the boring bit out the way. Here's what actually happened when we went in.
      - button "A small cat. Suspicious." [ref=f3e45] [cursor=pointer]
